modules implemented", "priority": "Should", "status": "Not started", "evidence": "Pending specific phase", "prompt": "Soon pending"}], "phases": [{"n": 1, "name": "Resume search and AI writing", "goal": "Upload or hand-draw persona → search → save contact → write letter → preview and save draft", "deps": "Start from empty project; external credentials can be default and use explicit Mock", "gate": "Persona, contact, and draft persistence; facts have basis; no real sending", "exclude": "Login/Gmail/queue/send/inbox/automated email sequence", "file": "prompt-01-mvp.md", "prompt": "Please develop Connact.ai Phase 1: Resume-based People Search and AI Writing.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nThis phase only develops the minimal MVP: upload resume/draw persona → search financial contacts → view recommendation rationale → save contact → AI write email → edit, variable preview, and save/copy draft.\n\nLayout: Professional B2B workspace, left navigation, top context, main content area, and contact drawer. Dashboard, Finance, Personas, People Search, Contacts, Email Studio are available. Academic, Templates, Mailboxes, Inbox, Campaigns, Analytics are explicitly Coming Soon. Persona is not a mandatory prerequisite for search or hand-written draft.\n\nPersona: Text-based PDF/DOCX, 10 MB limit, private storage; extract education/work/skills/financial domain/region/career goals. Retain original evidence, user review and confirmation to establish version. When scanned documents are not supported, explain the limitation; support hand-filled and multiple personas.\n\nSearch: Backend Apollo provides structured people search and on-demand enrichment; SerpAPI performs targeted LinkedIn public profile search via Google (e.g., site:linkedin.com/in/ with name and organization), does not directly call LinkedIn API. Both work around the same Contact to complement each other: Apollo information locates LinkedIn, verified LinkedIn URL/career information assists Apollo matching; existing adapters only have general search and Apollo ID supplement, targeted queries and reverse matching need to be implemented and validated. Keep sources and acquisition time separately, summary remains unverified, conflicts not overwritten, no automatic merging by same name. Implement job/organization/region/keyword pagination, source and time, limited batch supplementation. Unknown email is displayed as-is. Generate short recommendation rationale based on selected persona and source, do not fabricate alumni relationships. Save by provider ID to avoid duplicates, support manual contacts, tags, and notes.\n\nAI Writing: Set purpose, CTA, language, tone, and length based on contact and persona. Display available evidence and gaps on the right, allow selection of facts for writing. Generate structured subject/body/claims/warnings, display in suggestion area, do not overwrite the main text. Support comparison, adoption, discard, undo, and partial shortening/rewriting; suggestions should be bound to draft revision, expired results do not overwrite new drafts. Use Tiptap base rich text and variable nodes, missing variables are clearly identified; copied content must match preview. Server-side debounce save, version conflicts retain both contents; provide draft library and three Finance writing starters.\n\nTechnology: Next.js/React/TypeScript/Tiptap + FastAPI + PostgreSQL + Docker Compose. Fixed local workspace, all queries limited to workspace_id; this mode is only for local use. Encapsulate search, enrichment, public search, and AI Provider. Save PersonaVersion, SourceEvidence, MatchAssessment, GenerationRun, DraftRevision. Phase 1 does not install Redis, does not develop login, email, or sending.\n\nAcceptance: After refresh, personas/contacts/drafts exist; same person not duplicated; no facts created without evidence; generation failure retains original draft; missing variables cannot mark Ready; old suggestions cannot overwrite new edits; Mocks are explicitly stated; English default and Chinese switch are available. Deliver a runnable loop, not just page skeleton.\n"}, {"n": 2, "name": "Accounts, Gmail, and Single-Email Sending", "goal": "Login → multiple Gmail → pre-check → test/send single email in test/formal/scheduled mode", "deps": "P1 draft and workspace boundaries stable", "gate": "Two-user isolation; specified email real sending or truthfully mark unverified; idempotent/unknown handling", "exclude": "Complete Inbox/bulk activities/automated email sequence", "file": "prompt-02-mailboxes-send.md", "prompt": "Please develop Connact.ai Phase 2: Account Gmail and Single-Send.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nDevelop Phase 2 on top of Phase 1 code: formal account, multiple Gmail mailboxes, single test/formal/scheduled send. Do not develop full Inbox, batch Campaign, or auto follow-up.\n\nAccount: Implement Google platform login and User/Workspace/Membership, one Owner per personal workspace. Existing local demo data is explicitly migrated/claimed, cannot be automatically assigned to any logged-in user. Two test users must complete API/file/data isolation validation; production configuration disables demo login.\n\nEmail: Google platform login and Gmail authorization are separate, one user can connect to multiple and the login address is different. OAuth state, secure callback, applicable PKCE; Token/Refresh Token server-side encrypted, keys and database separated. Support refresh, expiration, disconnection/reauthorization, sender identity, platform signature, timezone, valid sending window, and platform limits. Apply for necessary permissions by function, separate explanation for public launch.\n\nSending: Reuse Phase 1 draft and preview, check recipient address, variables, attachments, HTML, block list, and email status before sending, freeze user-confirmed content version. Test defaults to sending to user's specified email, cannot count as formal delivery. Formal single send requires user confirmation; 'sent' only indicates provider acceptance. Attachments must be user-selected, check encoding and total size.\n\nScheduling: Add Redis/Worker, PostgreSQL persist SendJob/SendAttempt, execute by email timezone and window. Support cancel, pause, resume. API idempotency key, task uniqueness constraint, and execution lock prevent duplication. If already sent but response timeout, mark as unknown, first verify, do not blindly retry. Disconnection/failure stops the email task, manually banned address in workspace across emails takes effect.\n\nInterface reserves MailProvider's synchronous/reply capability but does not build Inbox UI in this phase. Record provider message/thread ID for association in Phase 3. Do not assume Gmail supports business idempotency key or absolute exactly-once.\n\nAcceptance: Two users and two Gmail mailboxes boundary correct; duplicate click does not duplicate task; specified test email completes real sending; test scheduling/cancel/disconnection/unknown scenarios. Deliver real adapter and Mock test when credentials are missing, mark real integration unverified. Keep Phase 1 persona search writing regression passing.\n"}, {"n": 3, "name": "Inbox and manual follow-up", "goal": "Synchronize emails → original thread reply → create reminder → active follow-up", "deps": "P2 Authorization and sending stability", "gate": "Real reply synchronization; expiration only reminder; new replies pause existing schedule", "exclude": "Auto next email / wait step / condition branch", "file": "prompt-03-inbox-followup.md", "prompt": "Please develop Connact.ai Phase 3: Inbox and Manual Follow-Up.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nDevelop Phase 3 on top of Phases 1 and 2: centralized Inbox, original conversation reply, manual follow-up, and protection for existing scheduling. Do not develop auto next email.\n\nSync: First read recent 30 days and paginate, persist history cursor, incremental polling defaults to two minutes and can be manually refreshed. Cursor expiration triggers sync recovery; ongoing old sessions continue tracking. Associate by workspace/mailbox/provider message/thread ID and deduplicate, messages sent and received outside the platform in Gmail can also enter the conversation.\n\nInbox: Three columns for filtering, conversation list, body and reply editor/contact sidebar. Support filtering by email, domain, unread, pending reply, and intent; unknown domain does not automatically fall under Finance. Read and archive sync with Gmail; notes, intent, and reminders only in the platform. Clean HTML, remote images default not loaded; attachments show metadata and available entry points.\n\nReply: Reuse draft and sending, maintain threadId, In- omated Email Sequence/ Mentor Database", "file": "prompt-04-campaigns-polish.md", "prompt": "Please develop Connact.ai Phase 4: Batch Campaign Templates and Analytics.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nDevelop Phase 4 on top of Phases 1–3: batch campaign, template/snippet management, basic analytics, configuration refinement, and Academic contract. Still no development of automated email sequences, team collaboration, billing, or Outlook real integration.\n\nCampaign Definition: A batch of independently approved emails by users; no capability to automatically generate second emails after the first. Save CampaignRecipient's contact, persona version, content snapshot, email, time, and result.\n\nAfter user selects the list, generate and preview emails for each individual, uniformly display missing variables, duplicate contacts, no email, block, attachments, limits, and time issues ant people',"Find related contacts")}</b><p class="muted">${t('Search works even without a persona.',"You can search directly without a persona.")}</p></div></div><div class="step"><div><b>${t('Review every suggestion',"Check each suggested draft")}</b><p class="muted">${t('AI never overwrites your draft without Apply.',"No adoption action means AI does not overwrite the body.")}</p></div></div></div><button data-module="search">${t('Open People Search',"Open people search")} →</button></div><div class="alert">${t('No scanned-document OCR is simulated. Selecting a file does not imply it was parsed.',"The demonstration does not simulate OCR for scanned documents. Selecting a file does not indicate completion of parsing.")}</div></section></div>`;}

function adminCard(){return `<div class="panel" style="margin-top:24px"><span class="tag future">Soon</span><h2>${t('Admin Console',"Admin backend")}</h2><p>${t('Planned, with no assigned phase or launch date. Separate from P1–P4 delivery gates.',"Included in pending development schedule, specific phase and date pending, not counted in P1–P4 delivery thresholds.")}</p><div class="grid3">${DATA.admin_pages.map(a=>`<div><h3>${esc(t(a.en,a.title))}</h3><p class="muted">${esc(a.behavior)}</p></div>`).join('')}</div><p class="muted">${t('Planning only. No live admin actions. Platform admin is a separate role from workspace owner.',"Only display planning, no real management operations. Platform administrator and workspace owner are separately authorized.")}</p></div>`}
function adminSoon(){el('view').innerHTML=heading('COMING SOON',t('Platform administration',"Platform management backend"),t('Operations and support tools planned for a future release. The phase 1 MVP stays unchanged.',"Platform operations and maintenance tools are included in future schedule, first phase minimum MVP scope remains unchanged."))+adminCard()}
function roadmap(){el('view').innerHTML=heading('DELIVERY PLAN',t('Four prompts, one evolving codebase',"Four Prompts, continuous development in the same codebase"),t('Finish and verify one phase before expanding. Real integration checks are separate from this offline demo.',"Each phase completes verification before expansion; real integration acceptance and offline demo are separated."))+`<div class="timeline">${DATA.phases.map(p=>`<div class="phasecard ${phase===p.n?'active':''}"><span class="eyebrow">PHASE ${p.n}</span><h3>${p.name}</h3><p>${p.goal}</p><p><b>${t('Gate',"Acceptance threshold")}</b><br>${p.gate}</p><p class="muted">${t('Excluded',"Not included")}: ${p.exclude}</p><button data-prompt="${p.n}">${t('Read and copy prompt',"View and copy Prompt")}</button><p style="margin-top:10px"><small>${DATA.features.filter(x=>x.phase===p.n).length} ${t('planned features',"Item planned feature")}</small></p></div>`).join('')}</div><div class="panel" style="margin-top:24px"><h2>${t('Handoff rule',"Handover rules")}</h2><p>${t('Phase 2 implements login before connecting real mailboxes. Phase 4 improves account settings; it does not postpone basic identity isolation. Every new prompt begins by inspecting and extending the existing repository.',"Phase two implements login before real email. Phase four only improves settings, does not delay basic identity isolation. Each new Prompt requires checking and continuing existing code.")}</p><p><a href="connact-ai-detailed-design.docx">Word ${t('detailed design',"Detailed design")}</a> · <a href="connact-ai-feature-roadmap.xlsx">Excel ${t('feature roadmap',"Feature List")}</a></p></div>`+adminCard()}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tab){tab=b.dataset.tab;shell();return;}if(b.dataset.module){module=b.dataset.module;tab='product';shell();return;}if(b.dataset.phase){phase=+b.dataset.phase;shell();return;}
 if(b.dataset.save){if(!s.saved.includes(b.dataset.save))s.saved.push(b.dataset.save);persist();render();toast(t('Saved once — no duplicate created.',"Saved, no duplicate creation."));return;}
 if(b.dataset.sources){const p=people.find(x=>x.id===b.dataset.sources);dialog(t('Two sources for one contact',"Dual-source example for the same contact"),`<p><b>${esc(p.name)}</b> · DEMO</p><div class="fact"><h3>Apollo</h3><p>${esc(p.title)} · ${esc(p.company)} · ${esc(p.location)}</p><small>${t('Fictional structured record. Email enrichment is a separate request.',"Fictional structured record. Email enrichment is a separate request.")}</small></div><div class="fact"><h3>LinkedIn · SerpAPI</h3><p>${t('A public-profile search could provide a profile URL and career snippet for this person. No real LinkedIn page was retrieved in this demo.',"Public profile search can provide profile URL and career summary for this person. This demo does not search real LinkedIn pages.")}</p><small>${t('Pending review. No source URL is fabricated.',"Pending verification, no fabricated source link.")}</small></div><p>${t('Compare profile identity, employer and dates before linking records. Keep conflicting values visible. Only confirmed facts may inform recommendations and writing.',"Verify profile identity, organization, and time before association, retain conflicting values. Only confirmed facts are used for recommendations and writing.")}</p>`);return;}
 if(b.dataset.write){switchRecipient(b.dataset.write);module='studio';tab='product';s.candidate=null;persist();shell();return;}
 if(b.dataset.flow!==undefined){flowIndex=+b.dataset.flow;workflow();return;}if(b.dataset.arch!==undefined){archIndex=+b.dataset.arch;architecture();return;}
 if(b.dataset.prompt){const p=DATA.phases.find(x=>x.n===+b.dataset.prompt);dialog('Phase '+p.n+' · '+p.name,`<p><a href="${p.file}" download>${t('Download Markdown',"Download Markdown")}</a></p><div class="prompttext" id="promptText">${esc(p.prompt)}</div><button class="primary" style="margin-top:15px" data-action="copyPrompt">${t('Copy prompt',"Copy Prompt")}</button>`);return;}
 if(b.dataset.template){s.brief.purpose=b.dataset.template;module='studio';tab='product';shell();return;}
 if(b.dataset.mailbox){const a=b.dataset.mailbox;s.mailboxes=s.mailboxes.includes(a)?s.mailboxes.filter(x=>x!==a):[...s.mailboxes,a];persist();mailboxes();return;}
 const a=b.dataset.action;
 if(a==='fixture'){s.profile=initial().profile;s.confirmed=false;persist();personas();el('fileStatus').textContent=t('Fictional sample loaded. No uploaded document was parsed.',"Fictional example loaded, file upload not parsed.");}
 if(a==='confirm'){s.profile={name:el('pName').value,degree:el('pDegree').value,experience:el('pExperience').value,goal:el('pGoal').value};if(!s.profile.name.trim())return toast(t('Enter a name.',"Please enter name."));s.confirmed=true;persist();personas();toast(t('Persona confirmed locally.',"Persona confirmed locally."));}
 if(a==='search'){const l=el('location').value,k=el('keyword').value.trim().toLowerCase();const list=people.filter(p=>(l==='all'||p.location===l)&&JSON.stringify(p).toLowerCase().includes(k));el('results').innerHTML=list.length?personTable(list):`<p class="alert">${t('No matching fictional records. Adjust your filters.',"No matching results in fictional example, please adjust conditions.")}</p>`;el('resultStatus').textContent=list.length+t(' demo result(s)',"  Demo result");}
 if(a==='apiError'){el('results').innerHTML=`<div role="alert" class="alert error">PROVIDER_RATE_LIMITED · ${t('Demo failure. Current contacts and drafts are preserved. Retry search to return to sample data.',"Demo failed. Existing contacts and drafts are retained. Research again to return to example data.")}</div>`;}
 if(a==='generate'||a==='shorten'){if(!s.confirmed)return toast(t('Confirm the persona first, or keep writing manually.',"Please confirm persona first, or continue writing manually."));if(a==='shorten'&&!s.body.trim())return toast(t('Write or apply a draft first.',"Please write a letter or adopt the draft first."));generate(a==='shorten');}
 if(a==='apply'&&s.candidate){if(s.candidate.base!==s.rev)return toast(t('Outdated suggestion. Regenerate.',"Suggestion expired, please regenerate."));s.previous={body:s.body,subject:s.subject};s.body=s.candidate.body;s.subject=s.candidate.subject;s.rev++;s.candidate=null;s.draftSaved=false;persist();studio();}
 if(a==='discard'){s.candidate=null;persist();studio();}
 if(a==='undo'&&s.previous){s.body=s.previous.body;s.subject=s.previous.subject;s.previous=null;s.rev++;s.candidate=null;persist();studio();}
 if(a==='variable'){s.body+=' {{first_name}}';s.rev++;persist();studio();}
 if(a==='saveDraft'){s.draftSaved=true;persist();toast(t('Draft saved locally. No email sent.',"Draft saved locally, no email sent."));}
 if(a==='preview')preview();
 if(a==='missing'){s.missing=!s.missing;persist();preview();}
 if(a==='stale'){if(!s.candidate)generate();if(!s.candidate)return;s.body+=(s.body?'\n\n':'')+t('Manual edit made after generation.',"New manual edits after generation.");s.rev++;persist();studio();}
 if(a==='copyDraft'){const r=finalDraft();await copy(r.subject+'\n\n'+r.body);}
 if(a==='copyPrompt')await copy(el('promptText').textContent);
 if(a==='testSend'){const r=el('testRecipient').value;if(!r.includes('@'))return toast(t('Enter a test address.',"Please enter test address."));s.sent.push({type:'test',recipient:r});persist();el('sendResult').textContent=t('Simulated event recorded. Nothing was sent to ',"Simulated event recorded, no real email sent to the following address:")+r;}
 if(a==='unknown')el('sendResult').innerHTML=`<span class="tag warn">unknown</span> ${t('Reconcile before retry. No automatic resend.',"Check before retrying, no automatic resend.")}`;
 if(a==='task'){s.task=true;s.taskDone=false;persist();inbox();toast(t('Reminder created locally.',"Reminder created locally."));}
 if(a==='taskDue'){if(!s.task)return toast(t('Create a reminder first.',"Please create a reminder first."));el('taskState').innerHTML=`<div class="alert">${t('Due now. Open the thread when ready. No email was created or sent.',"Expired, please open the session manually. No email generated or sent.")}</div>`;}
 if(a==='taskDone'){if(!s.task)return toast(t('No reminder yet.',"No reminder created yet."));s.taskDone=true;persist();inbox();}
 if(a==='replyArrived'){s.paused=true;persist();inbox();}
 if(a==='replyDemo'){switchRecipient('maya');s.previous={body:s.body,subject:s.subject};s.body='Hi Maya,\n\nThank you for your reply. ';s.subject='Re: A brief question about healthcare investment banking';s.rev++;s.selected='maya';s.candidate=null;module='studio';persist();shell();}
 if(a==='campaignReview')dialog(t('Batch preflight report',"Batch pre-check report"),`<div class="alert error">${t('Demo only — all addresses are fictional, so no production send can be approved.',"Only demo: all addresses are fictional, cannot approve real sending.")}</div><p style="margin-top:16px">Maya: ${t('Review required; demo address',"Pending review; demo address")}<br>Daniel: ${t('Missing email',"Missing email")}<br>Sophia: ${t('Review location mismatch',"Need to verify location mismatch")}</p><p>${t('Production must explicitly exclude invalid recipients and approve one content snapshot per person.',"Real product must explicitly exclude invalid recipients, approve content snapshots individually.")}</p>`);
 if(a==='pause'){s.paused=!s.paused;persist();campaigns();}
 if(a==='flowNext'){flowIndex=(flowIndex+1)%5;workflow();}if(a==='flowPrev'){flowIndex=(flowIndex+4)%5;workflow();}
 if(a==='flowOpen'){module=['personas','search','studio','studio','studio'][flowIndex];tab='product';shell();}
 if(a==='trace'){traceIndex=(traceIndex+1)%trace.length;archIndex=trace[traceIndex];architecture();}if(a==='traceReset'){traceIndex=0;archIndex=0;architecture();}
});
async function copy(text){try{await navigator.clipboard.writeText(text);toast(t('Copied.',"Copied."));}catch(e){dialog(t('Select and copy',"Please select and copy"),`<textarea style="min-height:300px" readonly>${esc(text)}</textarea>`);}}
document.addEventListener('input',e=>{if(e.target.id==='body'||e.target.id==='subject'){s.body=el('body').innerText;s.subject=el('subject').value;s.rev++;s.draftSaved=false;persist();el('saveState').textContent=t('Stored locally',"Local save")+' · revision '+s.rev;if(el('candidatePanel'))el('candidatePanel').innerHTML=candidateHTML();}});
document.addEventListener('change',e=>{if(e.target.id==='recipient'){switchRecipient(e.target.value);studio();}if(e.target.dataset.fact){const id=e.target.dataset.fact;s.facts=e.target.checked?[...new Set([...s.facts,id])]:s.facts.filter(x=>x!==id);invalidateCandidate();persist();}if(e.target.id==='scenario'){scenario=e.target.value;workflow();}if(e.target.id==='mobileNav'){module=e.target.value;tab='product';shell();}if(e.target.id==='cvFile'){const f=e.target.files[0];el('fileStatus').textContent=f?`${f.name} · `+t('Filename only. Use the fictional sample or enter fields manually.',"Only record file name, please load fictional example or fill manually."):'';}if(['purpose','emailLang','cta'].includes(e.target.id)){readBrief();invalidateCandidate();persist();}});
el('lang').onclick=()=>{lang=lang==='en'?'zh':'en';shell();};el('reset').onclick=()=>{s=initial();persist();tab='product';module='personas';phase=1;shell();toast(t('Demo reset.',"Demo reset."));};el('closeModal').onclick=()=>el('modal').close();shell();
</script></body></html>
